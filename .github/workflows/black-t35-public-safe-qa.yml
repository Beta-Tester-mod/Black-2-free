name: BLACK T35 Public Safe Target Gate QA

# Source-independent QA only. Never uses the original game executable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-gate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public repository without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject game executables, logs, assets and archives
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          bad_extensions = (
              '.xbe', '.iso', '.xiso', '.apk', '.aab', '.obb', '.so', '.dll',
              '.exe', '.bin', '.log', '.zip', '.7z', '.rar', '.pak', '.png',
              '.jpg', '.jpeg', '.ogg', '.wav', '.mp3', '.mp4', '.keystore',
              '.jks', '.p12', '.pem', '.key',
          )
          bad_prefixes = ('assets/', 'private-build-input/', 'build/', 'logs/', 'saves/')
          bad = [p for p in names if p and (p.lower().endswith(bad_extensions)
                                             or p.lower().startswith(bad_prefixes))]
          if bad:
              raise SystemExit('UNSAFE PUBLIC CONTENT: ' + ', '.join(bad))
          print('PASS: tracked files contain no recognized binary assets or logs')
          PY

      - name: T35 independent range, cone, geometry and head-sample tests
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import unittest

          MODES = (1.0, 1.5, 2.0, 3.0, 4.0, 6.0)

          def scale_query_cone(base, mode):
              if not isinstance(mode, int) or not (0 <= mode < len(MODES)):
                  return base
              if not math.isfinite(base) or base <= 0:
                  return base
              changed = base * MODES[mode]
              return changed if math.isfinite(changed) else base

          def model_gate(selected, ray_parameter, weapon_limit, geometry_reject):
              # MODEL ONLY: candidate range-like parameter has no verified metre units.
              # None means an observation was insufficient, not a confirmed hit.
              if not selected:
                  return 'NO_CANDIDATE'
              if geometry_reject is None:
                  return 'UNKNOWN_GEOMETRY'
              if geometry_reject:
                  return 'GEOMETRY_REJECTED'
              if weapon_limit is None or ray_parameter is None:
                  return 'UNKNOWN_RANGE'
              if not all(math.isfinite(x) and x >= 0 for x in (ray_parameter, weapon_limit)):
                  return 'UNKNOWN_RANGE'
              if ray_parameter > weapon_limit:
                  return 'RANGE_REJECTED'
              return 'PASSED_MODELED_GATES_NOT_CONFIRMED_HIT'

          def extract_finite(value):
              try:
                  n = float(value)
                  return n if math.isfinite(n) else None
              except (TypeError, ValueError, OverflowError):
                  return None

          class T35GateRegression(unittest.TestCase):
              def test_six_original_modes(self):
                  self.assertEqual([scale_query_cone(10, i) for i in range(6)],
                                   [10.0, 15.0, 20.0, 30.0, 40.0, 60.0])

              def test_higher_cone_does_not_override_range_gate(self):
                  self.assertGreater(scale_query_cone(10, 5), 25)
                  self.assertEqual(model_gate(True, 29.0, 25.0, False),
                                   'RANGE_REJECTED')

              def test_3x_and_6x_share_same_weapon_limit(self):
                  for mode in (3, 5):
                      self.assertGreater(scale_query_cone(10, mode), 25)
                      self.assertEqual(model_gate(True, 26.0, 25.0, False),
                                       'RANGE_REJECTED')

              def test_geometry_rejection_independent_of_range(self):
                  self.assertEqual(model_gate(True, 10, 25, True), 'GEOMETRY_REJECTED')
                  self.assertEqual(model_gate(True, 30, 25, True), 'GEOMETRY_REJECTED')

              def test_missing_candidate_is_not_geometry_failure(self):
                  self.assertEqual(model_gate(False, None, None, None), 'NO_CANDIDATE')

              def test_geometry_unobserved_stays_unknown(self):
                  self.assertEqual(model_gate(True, 12, 25, None), 'UNKNOWN_GEOMETRY')

              def test_missing_weapon_limit_is_not_a_hit(self):
                  self.assertEqual(model_gate(True, 12, None, False), 'UNKNOWN_RANGE')

              def test_missing_candidate_parameter_stays_unknown(self):
                  self.assertEqual(model_gate(True, None, 25, False), 'UNKNOWN_RANGE')

              def test_nonfinite_log_values_are_unknown(self):
                  for invalid in (float('nan'), float('inf'), -1.0):
                      self.assertEqual(model_gate(True, invalid, 25, False),
                                       'UNKNOWN_RANGE')
                      self.assertEqual(model_gate(True, 12, invalid, False),
                                       'UNKNOWN_RANGE')

              def test_exact_weapon_boundary(self):
                  self.assertEqual(model_gate(True, 25.0, 25.0, False),
                                   'PASSED_MODELED_GATES_NOT_CONFIRMED_HIT')
                  self.assertEqual(model_gate(True, 25.0001, 25.0, False),
                                   'RANGE_REJECTED')

              def test_invalid_boost_fails_closed(self):
                  self.assertEqual(scale_query_cone(10, 99), 10)
                  self.assertEqual(scale_query_cone(10, -1), 10)
                  self.assertEqual(scale_query_cone(0, 5), 0)
                  self.assertTrue(math.isnan(scale_query_cone(float('nan'), 3)))
                  self.assertEqual(scale_query_cone(1.4e308, 5), 1.4e308)

              def test_separate_observation_quotas(self):
                  events = {'empty': 160, 'selected': 27, 'geometry': 9}
                  self.assertGreater(events['selected'], 0)
                  self.assertGreater(events['geometry'], 0)
                  # Legacy shared quota must not erase later stages in T33 design.
                  self.assertNotEqual(events['empty'], events['selected'])

              def test_finite_float_fields(self):
                  self.assertEqual(extract_finite('23.5'), 23.5)
                  self.assertIsNone(extract_finite('nan'))
                  self.assertIsNone(extract_finite('inf'))
                  self.assertIsNone(extract_finite('not-numeric'))

              def test_upper_y_sample_cannot_prove_headshot(self):
                  result = model_gate(True, 12, 25, False)
                  self.assertNotEqual(result, 'HEADSHOT')
                  self.assertNotEqual(result, 'HIT')
                  self.assertIn('NOT_CONFIRMED_HIT', result)

          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromTestCase(T35GateRegression))
          if not result.wasSuccessful():
              raise SystemExit(1)
          print('T35 PASS: modeled stages are independent; real Android behavior NOT tested.')
          PY

      - name: Fetch public BLACK Android reference only
        shell: bash
        run: |
          git clone --depth 1 --branch v1.4.1 \
            https://github.com/RanggaCasper/Black-Android.git public-upstream

      - name: Validate original public source anchors, not private patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          root = Path('public-upstream')
          mouse = (root/'src/game/mouse.cpp').read_text(encoding='utf-8')
          hooks = (root/'src/game/hooks.cpp').read_text(encoding='utf-8')
          layout = (root/'src/game/layout.h').read_text(encoding='utf-8')
          table = tomllib.loads((root/'config/game.toml').read_text(encoding='utf-8'))
          assert 'bool AimAssist(' in mouse
          assert 'static uint32_t Player() { return R32(kWorld) + kWorldPlayer; }' in hooks
          assert 'constexpr uint32_t kPlayerWeapon = 0x29C;' in hooks
          assert 'constexpr uint32_t kWeaponData = 0xEC;' in hooks
          assert 'constexpr uint32_t kWorldPlayer = 0x30;' in layout
          assert sum(h.get('at') == 0x1DCDAB and h.get('call') == 'AimAssist'
                     for h in table['hook']) == 1
          print('PASS: v1.4.1 source anchors verified; native x86 hooks NOT executed')
          print('NOTE: v1.4.1 baseline contains no private T34/T35 APK patches.')
          PY
